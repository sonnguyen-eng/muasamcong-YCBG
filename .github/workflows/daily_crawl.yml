name: Auto Bidding Search Daily

on:
 schedule:
    # 16:55 UTC tương đương với 23:55 PM giờ Việt Nam (GMT+7)
    - cron: '55 16 * * *'
  workflow_dispatch: # Vẫn giữ tính năng cho phép bấm chạy thủ công nếu cần

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt các thư viện cần thiết
        run: pip install requests google-genai

      - name: Thực thi Script quét thầu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python crawl_bidding.py
