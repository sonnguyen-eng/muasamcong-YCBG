name: Run Daily YCBG Medical Procurement Crawler

on:
  schedule:
    # Kích hoạt lúc 23:40 Giờ Việt Nam (16:40 UTC) hàng ngày
    - cron: '40 16 * * *'
  workflow_dispatch: # Cho phép bấm thủ công bất kỳ lúc nào

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager google-genai

      - name: Run YCBG Crawler Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python crawl_ycbg.py
