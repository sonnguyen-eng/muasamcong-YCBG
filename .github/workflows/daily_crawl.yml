name: Auto Bidding Search Daily

on:
  schedule:
    # 16:55 UTC tương đương với 23:55 PM giờ Việt Nam (GMT+7)
    - cron: '55 16 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Python & Playwright Trình duyệt
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Thực thi Script quét thầu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python crawl_bidding_daily.py
