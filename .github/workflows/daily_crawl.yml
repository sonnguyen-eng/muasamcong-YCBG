name: Daily YCBG Bot Processor

on:
  schedule:
    - cron: '0 1 * * *' # Chạy tự động vào 08:00 sáng hàng ngày (giờ VN)
  workflow_dispatch:   # Cho phép kích hoạt chạy thủ công từ giao diện GitHub

jobs:
  run-ycbg-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Last SCHEDULED Workflow Run Timestamp
        id: last_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow_id,
              event: 'schedule',
              status: 'success',
              per_page: 5
            });
            
            let lastScheduledRunTime = '';
            if (context.eventName === 'schedule' && runs.data.workflow_runs.length > 1) {
              lastScheduledRunTime = runs.data.workflow_runs[1].created_at;
            } else if (context.eventName === 'workflow_dispatch' && runs.data.workflow_runs.length > 0) {
              lastScheduledRunTime = runs.data.workflow_runs[0].created_at;
            }
            
            core.setOutput('last_run_timestamp', lastScheduledRunTime);
            console.log(`Mốc thời gian chạy tự động gần nhất: ${lastScheduledRunTime}`);

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager google-genai

      - name: Execute YCBG Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          LAST_RUN_TIMESTAMP: ${{ steps.last_run.outputs.last_run_timestamp }}
        run: python crawl_ycbg.py
